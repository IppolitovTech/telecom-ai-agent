services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - hf_cache:/app/.cache/huggingface
      - chroma_data:/app/chroma_data
      - ./knowledge:/knowledge

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"

volumes:
  hf_cache:
  chroma_data:
